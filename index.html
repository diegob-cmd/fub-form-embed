<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VTK Appointment</title>
    <!-- Follow Up Boss Embedded App SDK -->
    <script type="text/javascript" src="https://eia.followupboss.com/embeddedApps-v1.0.1.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 220px; 
        background-color: #ffffff;
      }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        padding: 12px; 
        font-size: 13px; 
        color: #2b3b4c;
        box-sizing: border-box;
      }
      .data-row { 
        margin-bottom: 8px; 
        padding-bottom: 6px; 
        border-bottom: 1px solid #edf2f7; 
      }
      .label { 
        font-weight: 600; 
        color: #718096; 
        display: block; 
        font-size: 11px; 
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .value { 
        font-size: 13px; 
        color: #1a202c; 
        font-weight: 500;
        word-break: break-word;
      }
      .status-box {
        padding: 10px;
        border-radius: 4px;
        background: #f7fafc;
        border: 1px solid #e2e8f0;
        font-size: 12px;
        color: #4a5568;
      }
    </style>
  </head>
  <body>
    <div id="idx-content">
      <div class="status-box" id="status-msg">Loading connection to FUB...</div>
    </div>

    <script>
      // 1. Paste your deployed Google Apps Script Web App URL here
      const GOOGLE_SCRIPT_API_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

      function updateStatus(message) {
        const el = document.getElementById('idx-content');
        if (el) el.innerHTML = `<div class="status-box">${message}</div>`;
      }

      function renderLeadData(data) {
        document.getElementById('idx-content').innerHTML = `
          <div class="data-row">
            <span class="label">Property Address</span>
            <span class="value">${data.address || "—"}</span>
          </div>
          <div class="data-row">
            <span class="label">Assigned Zone</span>
            <span class="value">${data.area || "—"}</span>
          </div>
          <div class="data-row">
            <span class="label">Lead Type</span>
            <span class="value">${data.tipoLead || "—"}</span>
          </div>
          <div class="data-row">
            <span class="label">ISA</span>
            <span class="value">${data.isa || "—"}</span>
          </div>
        `;
      }

      function fetchSheetData(leadId, email, phone) {
        if (!leadId) {
            updateStatus("Error: No Lead ID provided to fetch.");
            return;
        }

        updateStatus(`Searching Google Sheet for Lead ID: <b>${leadId}</b>...`);

        if (GOOGLE_SCRIPT_API_URL.includes("YOUR_SCRIPT_ID")) {
          updateStatus("Ready. Replace <code>YOUR_SCRIPT_ID</code> in <code>index.html</code> with your Google Apps Script URL.");
          return;
        }

        // Construct URL safely handling undefined email/phone
        const safeEmail = email || "";
        const safePhone = phone || "";
        const queryUrl = `${GOOGLE_SCRIPT_API_URL}?leadId=${encodeURIComponent(leadId)}&email=${encodeURIComponent(safeEmail)}&phone=${encodeURIComponent(safePhone)}`;

        fetch(queryUrl)
          .then(res => res.json())
          .then(res => {
            if (res.success && res.found && res.data) {
              renderLeadData(res.data);
            } else {
              updateStatus(`No records found for Lead ID <b>${leadId}</b>.`);
            }
          })
          .catch(err => {
            console.error("API error:", err);
            updateStatus("Failed to communicate with Google Sheets backend.");
          });
      }

      // Safe extraction helper
      function extractPersonData(person) {
          if (!person) return null;
          return {
              id: person.id || "",
              email: (person.emails && person.emails.length > 0) ? person.emails[0].value : "",
              phone: (person.phones && person.phones.length > 0) ? person.phones[0].value : ""
          };
      }

      // Safe initialization
      window.onload = function() {
        try {
            if (typeof FUB !== 'undefined' && typeof FUB.init === 'function') {
                FUB.init().then(function(context) {
                    if (context && context.person) {
                        const pd = extractPersonData(context.person);
                        if (pd.id) {
                            fetchSheetData(pd.id, pd.email, pd.phone);
                        } else {
                            updateStatus("No Lead ID found in the FUB context.");
                        }
                    } else {
                        updateStatus("FUB Connected, but no person context available (Preview mode?).");
                    }
                }).catch(function(err) {
                    console.error("FUB Init rejected:", err);
                    updateStatus("Follow Up Boss connection rejected.");
                });
            } else {
                 updateStatus("Follow Up Boss SDK not detected.");
            }
        } catch (e) {
            console.error("Fatal error during init:", e);
            updateStatus("Fatal script error: " + e.message);
        }
      };
    </script>
  </body>
</html>
