<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VTK Appointment</title>
    <script type="text/javascript" src="https://eia.followupboss.com/embeddedApps-v1.0.1.js"></script>
    <style>
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        margin: 0;
        padding: 6px;
        box-sizing: border-box;
      }
      .form-container {
        width: 100%;
        height: 100vh;
      }
      iframe {
        width: 100%;
        height: 800px;
        border: none;
        border-radius: 6px;
      }
      .status-box {
        padding: 10px;
        border-radius: 4px;
        background: #f7fafc;
        border: 1px solid #e2e8f0;
        font-size: 12px;
        color: #4a5568;
      }
    </style>
  </head>
  <body>
    <div id="form-wrapper">
      <div class="status-box">Loading Google Form...</div>
    </div>

    <script>
      // 1. Base URL of your Google Form
      const GOOGLE_FORM_BASE_URL = "https://docs.google.com/forms/d/e/1FAIpQLSezQOU-A8zMwSCDudjomGj2VsDsCNmbFH9fs_H6XPGkLsfihg/viewform?usp=sharing&ouid=106637086441749552268";

      // 2. Pre-fill entry IDs (Leave empty string "" if not prefilling that field)
      const ENTRY_FUB_ID = "entry.111111111"; // Lead ID field
      const ENTRY_NAME   = "entry.222222222"; // Name field
      const ENTRY_EMAIL  = "entry.333333333"; // Email field
      const ENTRY_PHONE  = "entry.444444444"; // Phone field

      function loadForm(person) {
        let url = GOOGLE_FORM_BASE_URL;

        if (person) {
          const leadId = String(person.id || "").trim();
          const email = (person.emails && person.emails[0]) ? person.emails[0].value.trim() : "";
          const phone = (person.phones && person.phones[0]) ? person.phones[0].value.trim() : "";
          const displayName = ((person.firstName || "") + " " + (person.lastName || "")).trim();

          if (ENTRY_FUB_ID && leadId) url += `&${ENTRY_FUB_ID}=${encodeURIComponent(leadId)}`;
          if (ENTRY_NAME && displayName) url += `&${ENTRY_NAME}=${encodeURIComponent(displayName)}`;
          if (ENTRY_EMAIL && email) url += `&${ENTRY_EMAIL}=${encodeURIComponent(email)}`;
          if (ENTRY_PHONE && phone) url += `&${ENTRY_PHONE}=${encodeURIComponent(phone)}`;
        }

        document.getElementById('form-wrapper').innerHTML = `
          <div class="form-container">
            <iframe src="${url}" frameborder="0" marginheight="0" marginwidth="0">Loading form...</iframe>
          </div>
        `;
      }

      function parseUrlContext() {
        try {
          const params = new URLSearchParams(window.location.search);
          const raw = params.get('context');
          if (raw) {
            const data = JSON.parse(atob(raw));
            if (data && data.person) return data.person;
          }
        } catch (e) {
          console.warn("Could not parse context param", e);
        }
        return null;
      }

      let initialized = false;

      // Check context in URL
      const urlPerson = parseUrlContext();
      if (urlPerson) {
        initialized = true;
        loadForm(urlPerson);
      }

      // Initialize via Follow Up Boss Embedded App SDK
      if (window.FUB && typeof FUB.init === 'function') {
        FUB.init().then(function(context) {
          if (!initialized && context && context.person) {
            initialized = true;
            loadForm(context.person);
          }
        }).catch(function() {
          if (!initialized) loadForm(null);
        });
      } else if (!urlPerson) {
        loadForm(null);
      }
    </script>
  </body>
</html>
